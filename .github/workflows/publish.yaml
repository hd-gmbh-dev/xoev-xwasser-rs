name: Publish to crates.io and registry.npmjs.org

on:
  workflow_call:
    secrets:
      # only until trusted publishing is configured for the three crates and the
      # two npm packages; the workflow itself needs no long-lived token
      CRATES_TOKEN:
        required: false
      NPM_TOKEN:
        required: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@1.94.1
    - name: get-cmake
      uses: lukka/get-cmake@latest
    - name: Publish to crates.io.
      run: |
        VERSION=$(cargo pkgid -p xoev-xwasser 2>/dev/null | sed 's/.*@//')
        echo "Version: $VERSION"
        for crate in xoev-xwasser-derive xoev-xwasser-codelists xoev-xwasser; do
          if curl -s -4 --fail-with-body \
                -H "User-Agent: github-actions/${GITHUB_REPOSITORY}" \
                "https://crates.io/api/v1/crates/${crate}/versions" \
                | jq -e --arg v "${VERSION}" '.versions[] | select(.num == $v) | .num' > /dev/null; then
            echo "Skipping $crate - already published ($VERSION)"
          else
            if [ "$crate" = "xoev-xwasser-codelists" ]; then
              cargo publish --token ${CRATES_TOKEN} --no-verify -p "$crate"
            else
              cargo publish --token ${CRATES_TOKEN} -p "$crate"
            fi
          fi
        done
      env:
        CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
    - name: Download NPM artifact
      uses: actions/download-artifact@v4
      with:
        name: xoev-xwasser-pkg
        path: pkg
    - run: npm publish --provenance --access public
      working-directory: ./pkg
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Download NPM Web artifact
      uses: actions/download-artifact@v4
      with:
        name: xoev-xwasser-pkg-web
        path: pkg
    - run: npm publish --provenance --access public
      working-directory: ./pkg
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: publish
    # a release is a repository write and needs no personal access token
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes
