name: Publish to crates.io and registry.npmjs.org

on:
  workflow_call:
    secrets:
      CRATES_TOKEN:
        required: true
      BOT_GITHUB_TOKEN:
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@1.94.1
    - name: get-cmake
      uses: lukka/get-cmake@latest
    - name: Publish to crates.io.
      run: |
        VERSION=$(cargo pkgid -p xoev-xwasser 2>/dev/null | sed 's/.*@//')
        echo "Version: $VERSION"
        for crate in xoev-xwasser-derive xoev-xwasser-codelists xoev-xwasser; do
          if curl -s -4 --fail-with-body \
                -H "User-Agent: github-actions/${GITHUB_REPOSITORY}" \
                "https://crates.io/api/v1/crates/${crate}/versions" \
                | jq -e --arg v "${VERSION}" '.versions[] | select(.num == $v) | .num' > /dev/null; then
            echo "Skipping $crate - already published ($VERSION)"
          else
            if [ "$crate" = "xoev-xwasser-codelists" ]; then
              cargo publish --token ${CRATES_TOKEN} --no-verify -p "$crate"
            else
              cargo publish --token ${CRATES_TOKEN} -p "$crate"
            fi
          fi
        done
      env:
        CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
    - name: Download NPM artifact
      uses: actions/download-artifact@v4
      with:
        name: xoev-xwasser-pkg
        path: pkg
    - run: npm publish --provenance --access public
      working-directory: ./pkg
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Download NPM Web artifact
      uses: actions/download-artifact@v4
      with:
        name: xoev-xwasser-pkg-web
        path: pkg
    - run: npm publish --provenance --access public
      working-directory: ./pkg
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: publish
    # a release is a repository write and needs no personal access token
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # several release lines live in this repository; "Latest" belongs to
          # the greatest version, not to the one released last
          greatest=$(git ls-remote --tags origin \
            | sed 's|.*refs/tags/||' \
            | grep -v '\^{}' \
            | sort -V \
            | tail -1)
          latest=false
          [ "$greatest" = "$GITHUB_REF_NAME" ] && latest=true
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest="$latest"
