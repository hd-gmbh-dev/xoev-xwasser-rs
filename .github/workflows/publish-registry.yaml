name: Publish to crates.io and registry.npmjs.org

on:
  workflow_call:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@1.100.0
    - name: get-cmake
      uses: lukka/get-cmake@latest
    - uses: rust-lang/crates-io-auth-action@v1
      id: crates-auth
    - name: Publish to crates.io.
      run: |
        VERSION=$(cargo pkgid -p xoev-xwasser 2>/dev/null | sed 's/.*@//')
        echo "Version: $VERSION"
        for crate in xoev-xwasser-derive xoev-xwasser-codelists xoev-xwasser; do
          if curl -s -4 --fail-with-body \
                -H "User-Agent: github-actions/${GITHUB_REPOSITORY}" \
                "https://crates.io/api/v1/crates/${crate}/versions" \
                | jq -e --arg v "${VERSION}" '.versions[] | select(.num == $v) | .num' > /dev/null; then
            echo "Skipping $crate - already published ($VERSION)"
          else
            if [ "$crate" = "xoev-xwasser-codelists" ]; then
              cargo publish --no-verify -p "$crate"
            else
              cargo publish -p "$crate"
            fi
          fi
        done
      env:
        # minted from the crates.io trusted publisher, valid for this job only
        CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        registry-url: 'https://registry.npmjs.org'
    - name: Download NPM artifact
      uses: actions/download-artifact@v4
      with:
        name: xoev-xwasser-pkg
        path: pkg
    # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token with the trusted
    # publisher configured on the package.
    - run: npm publish --provenance --access public
      working-directory: ./pkg
    - name: Download NPM Web artifact
      uses: actions/download-artifact@v4
      with:
        name: xoev-xwasser-pkg-web
        path: pkg
    - run: npm publish --provenance --access public
      working-directory: ./pkg
  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: publish
    # a release is a repository write and needs no personal access token
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # several release lines live in this repository; "Latest" belongs to the
          # greatest version, not to the one released last
          greatest=$(git ls-remote --tags origin \
            | sed 's|.*refs/tags/||' \
            | grep -v '\^{}' \
            | sort -V \
            | tail -1)
          latest=false
          [ "$greatest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest="$latest"
